<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verdent Design First</title>
<style>
:root{--ink:#0f2a1e;--green:#1f9d6c}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#e9ecea;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}

.decision{position:absolute;top:638px;left:90px;right:90px;text-align:center;font-size:12px;font-weight:650;color:var(--ink);visibility:hidden;z-index:8}
.decision b{color:var(--green)}
.endcard{position:absolute;inset:0;background:white;z-index:30;display:grid;place-content:center;justify-items:center;gap:26px;visibility:hidden}.logo{width:240px;height:auto}.endline{font:25px/1.16 Georgia,serif;text-align:center}
</style>
</head>
<body>

</main>
<script type="module">

const maps={calm:texture(c=>surface(c)),done:texture(c=>surface(c,'calm','Today',true)),editorial:texture(c=>surface(c,'editorial')),bold:texture(c=>surface(c,'bold')),welcome:texture(c=>surface(c,'calm','Welcome')),progress:texture(c=>surface(c,'calm','Progress'))};

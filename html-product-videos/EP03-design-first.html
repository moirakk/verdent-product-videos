<title>Verdent Design First</title>

.decision{position:absolute;top:638px;left:90px;right:90px;text-align:center;font-size:12px;font-weight:650;color:var(--ink);visibility:hidden;z-index:8}
.decision b{color:var(--green)}
.traits{display:block;margin-top:5px;font-size:10px;line-height:1.3;font-weight:500;color:#617568}
.endcard{position:absolute;inset:0;background:white;z-index:30;display:grid;place-content:center;justify-items:center;gap:26px;visibility:hidden}.logo{width:240px;height:auto}.endline{font:25px/1.16 Georgia,serif;text-align:center}

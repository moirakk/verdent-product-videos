<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verdent Deep Research</title>
<style>
:root{--ink:#0f2a1e;--green:#1f9d6c}*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#e9ecea;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
.film{position:absolute;left:50%;top:50%;width:430px;height:764px;transform-origin:center;overflow:hidden;background:#fbfdfb;isolation:isolate;perspective:1000px;box-shadow:0 36px 100px #0f2a1e22}
.copy{position:absolute;left:28px;right:28px;top:34px;height:155px;z-index:20;pointer-events:none}.kicker{font:700 11px/1.2 monospace;color:var(--green)}
h1{font-size:42px;line-height:1.06;font-weight:800;letter-spacing:0;margin:16px 0 0;perspective:650px}.line{display:block;white-space:nowrap}.line:last-child{color:var(--green)}.word{display:inline-block;margin-right:.19em;transform-origin:50% 90%}.word:last-child{margin:0}
.volume{position:absolute;top:192px;width:430px;height:500px}.volume canvas{display:block;width:100%;height:100%}
.caption{position:absolute;bottom:28px;left:28px;right:28px;height:30px;display:flex;align-items:flex-end;font-size:12px;line-height:1.4;font-weight:600;color:#526c5e;z-index:10}
.source{position:absolute;left:28px;bottom:66px;font:10px/1.2 Arial,sans-serif;color:#708176;z-index:10}
.prompt{position:absolute;left:40px;top:310px;width:350px;padding:24px;background:#fff;border:1px solid #d9e6dc;border-radius:8px;box-shadow:0 6px 0 #d9e6dc,0 28px 50px #0f2a1e18;z-index:6;visibility:hidden}
.prompt-label{font-size:10px;font-weight:700;color:#526c5e;margin-bottom:14px}.prompt-text{font-size:25px;font-weight:650;line-height:1.25;height:100px}.prompt-bottom{margin-top:12px;padding-top:14px;border-top:1px solid #edf2ee;font-size:12px;color:#526c5e;display:flex;align-items:center;gap:10px}.send{margin-left:auto;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;background:#144835}
.endcard{position:absolute;inset:0;background:white;z-index:30;display:grid;place-content:center;justify-items:center;gap:26px;visibility:hidden}.logo{width:240px;height:auto}.endline{font:25px/1.16 Georgia,serif;text-align:center}
</style>
</head>
<body>
<main class="film" aria-label="Verdent Deep Research animated product film">
<header class="copy"><div class="kicker">VERDENT / DEEP RESEARCH</div><h1></h1></header>
<div class="volume" aria-hidden="true"></div>
<article class="prompt"><div class="prompt-label">START WITH A QUESTION</div><div class="prompt-text"></div><div class="prompt-bottom"><span>Pricing. Features. Sources.</span><span class="send">&#8593;</span></div></article>
<div class="source">Illustrative research / fictional tools and prices</div><div class="caption"></div>
<footer class="endcard"><img class="logo" src="assets/verdent-logo.png" alt="Verdent"><div class="endline">One question.<br>A sourced perspective.</div></footer>
</main>
<script type="module">
import * as THREE from './assets/three.module.min.js';
const $=s=>document.querySelector(s),clamp=x=>Math.max(0,Math.min(1,x)),mix=(a,b,p)=>a+(b-a)*p;

const duration=33,film=$('.film');

 {id:3,name:'Tool C',domain:'tool-c.example/pricing',price:24,reminders:'Included'}
];
window.researchExample={illustrative:true,currency:'USD',billing:'monthly, per seat',sources:evidence,lowestBasePrice:'Tool A',unknown:'Tool B reminder add-on price'};

 [0,3,'One question.|A wider view.','Research starts with something worth asking.'],
 [3,6,'Set the scope.|Start exploring.','Compare pricing, features, and the sources.'],
 [6,11.5,'Explore more.|Keep the sources.','Read across sources, not just one page.'],
 [11.5,17,'Same basis.|Clear differences.','Monthly billing. One seat. A fair comparison.'],
 [17,23,'Spot the gap.|Before deciding.','An unlisted add-on cost stays an open question.'],
 [23,29.5,'Evidence in.|Clarity out.','A concise research brief, with sources retained.']

 });

  text(c,e.name,18,40,23);text(c,`$${e.price}`,151,40,25);text(c,`[${e.id}]`,267,40,13,'#1f9d6c',700);
  text(c,i===1?'Reminders: add-on cost unknown':'Reminders included',18,76,13,'#617568',500);
 });row.position.z=2;g.add(row);

});
const basis=panel(320,60,c=>{text(c,'COMPARE LIKE FOR LIKE',18,24,10,'#1f9d6c',700);text(c,'USD / month / one seat',18,45,17)});
const gap=panel(320,148,c=>{
 text(c,'TOOL B / SOURCE [2]',20,28,11,'#1f9d6c',700);text(c,'Reminder add-on',20,64,25);text(c,'Price not listed.',20,98,25);
 text(c,'Keep this question open.',20,129,13,'#617568',500);
});
const gapBacking=slab(326,154,4,0x144835);gapBacking.position.z=-14;gap.add(gapBacking);

 text(c,'RESEARCH BRIEF',22,28,10,'#1f9d6c',700);text(c,'The useful picture.',22,63,27);
 text(c,'LOWEST LISTED BASE PRICE',22,103,10,'#617568',600);text(c,'Tool A: $12 / seat / month',22,133,20);text(c,'Compared with $18 and $24. [1-3]',22,155,12,'#617568',500);
 line(c,22,175,316,175);text(c,'STILL TO CHECK',22,201,10,'#1f9d6c',700);text(c,'Tool B reminder add-on:',22,228,18);text(c,'price not listed. [2]',22,253,18);
 line(c,22,274,316,274);text(c,'SOURCES',22,296,10,'#617568',600);
 text(c,'[1] Tool A   [2] Tool B   [3] Tool C',22,319,12);text(c,'Verify live pricing before choosing.',22,344,12,'#617568',500);
});
const reportBacking=slab(346,372,4,0x144835);reportBacking.position.z=-14;report.add(reportBacking);

const references=evidence.map(e=>panel(90,30,c=>text(c,`[${e.id}] ${e.name}`,10,20,13,'#144835',650),0xe8f3eb));
let start=performance.now(),frozen=null,active='',lastShadowTime=-1;

window.seek=t=>{frozen=Math.max(0,Math.min(duration,t));render(frozen)};window.play=()=>{if(frozen!==null)start=performance.now()-frozen*1000;frozen=null};window.restart=()=>{start=performance.now();frozen=null};

 window.filmTime=t;const beat=beats.find(b=>t>=b[0]&&t<b[1])||beats.at(-1),closing=1-phase(t,29.15,29.65);
 show($('.copy'),closing);show($('.source'),closing);

 document.querySelectorAll('.word').forEach((el,i)=>{const p=phase(t,beat[0]+i*.05,beat[0]+i*.05+.55),out=phase(t,beat[1]-.3,beat[1]);el.style.opacity=p*(1-out);el.style.transform=`translateY(${(1-p)*24-out*8}px) rotateX(${(1-p)*35}deg)`});

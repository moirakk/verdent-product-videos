<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verdent · 发布上线单集审片</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf1ed;color:#153c2b;font:14px/1.5 Arial,sans-serif}main{max-width:1040px;margin:36px auto;padding:0 24px;display:grid;grid-template-columns:300px 1fr;gap:48px}h1{font-size:29px;line-height:1.2;margin:12px 0}small{font:11px monospace;color:#1f9d6c}p{color:#617568}nav{display:grid;gap:8px;margin-top:28px}button,a{font:inherit}nav button{background:#ffffff;border:1px solid #d9e6dc;border-radius:9px;text-align:left;padding:13px 16px;color:#153c2b;cursor:pointer}nav button[aria-current=true]{background:#153c2b;color:#ffffff}nav span{display:block;font-size:11px;opacity:.65;margin-top:3px}.screen{display:flex;flex-direction:column;align-items:center}iframe{border:0;width:390px;height:693px;max-width:100%;background:#fbfdfb;box-shadow:0 24px 70px #153c2b18;border-radius:3px}.controls{display:flex;flex-wrap:wrap;gap:8px;width:390px;max-width:100%;margin-top:18px;align-items:center}.controls button{border:1px solid #cfddd2;background:white;border-radius:6px;padding:7px 11px;color:#153c2b;cursor:pointer}input{width:100%;accent-color:#1f9d6c}a{color:#1f9d6c;text-decoration:none;margin-left:auto}.note{font-size:12px;margin-top:22px}@media(max-width:760px){main{grid-template-columns:1fr;margin:20px auto;gap:24px;padding:0 18px}nav{grid-template-columns:1fr 1fr;margin-top:18px;gap:6px}nav button{padding:9px 12px}h1{font-size:24px}.note{display:none}iframe{height:min(693px,160vw)}}</style></head>
<body><main><section><small>VERDENT / PRODUCT FILMS</small><h1>Publish<br>单集审片</h1><p>EP10 · v003<br>27 秒竖屏 · 待审阅</p><nav aria-label="选择集数"></nav><p class="note">先审这一集，再推进下一集。此前的批量稿不作为完成稿。</p></section><section class="screen"><iframe title="产品视频预览" allow="autoplay"></iframe><div class="controls"><button id="restart">重播</button><button id="play">播放</button><button id="pause">暂停</button><span id="time">0.0 / 27s</span><a id="direct" target="_blank">单独打开 ↗</a><input aria-label="定位时间" type="range" min="0" max="27" step="0.05" value="0"></div></section></main>
<script>const episodes=[['10','publish','Publish','本次审阅 · 发布上线','v003'],['08','create-image','Create Image','上一集 · 图片素材','v005']];const iframe=document.querySelector('iframe'),range=document.querySelector('input');let index=0;episodes.forEach((e,i)=>{const b=document.createElement('button');b.innerHTML=`EP${e[0]} · ${e[2]}<span>${e[3]}</span>`;b.onclick=()=>open(i);document.querySelector('nav').append(b)});function open(i){index=i;let e=episodes[i],url=`versions/EP${e[0]}/${e[4]}/EP${e[0]}-${e[1]}.html`;iframe.src=url;document.querySelector('h1').innerHTML=e[2]+'<br>单集审片';document.querySelector('main section > p').innerHTML='EP'+e[0]+' · '+e[4]+'<br>27 秒竖屏 · 待审阅';document.querySelector('#direct').href=url;document.querySelectorAll('nav button').forEach((b,j)=>b.setAttribute('aria-current',i===j));range.value=0}function run(f){const w=iframe.contentWindow;try{f(w)}catch(e){}}document.querySelector('#restart').onclick=()=>run(w=>w.restart());document.querySelector('#play').onclick=()=>run(w=>w.play());document.querySelector('#pause').onclick=()=>run(w=>w.seek(w.filmTime||0));range.oninput=()=>run(w=>w.seek(+range.value));setInterval(()=>run(w=>{if(Number.isFinite(w.filmTime)){range.value=w.filmTime;document.querySelector('#time').textContent=w.filmTime.toFixed(1)+' / 27s'}}),100);open(0);</script></body></html>
